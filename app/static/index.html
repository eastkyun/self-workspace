<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="월간 캘린더로 일정을 기록하고 관리하는 다이어리">
    <title>월간 일정 다이어리</title>
    <link
      rel="preload"
      href="/static/vendor/pretendard/1.3.9/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link rel="stylesheet" href="/static/vendor/fullcalendar/7.0.2/skeleton.css">
    <link rel="stylesheet" href="/static/vendor/fullcalendar/7.0.2/themes/classic/theme.css">
    <link rel="stylesheet" href="/static/vendor/fullcalendar/7.0.2/themes/classic/palette.css">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <p class="eyebrow">MONTHLY DIARY</p>
        <h1>일정 다이어리</h1>
      </div>
      <div class="calendar-navigation" aria-label="달력 탐색">
        <button class="icon-button navigation-button" id="previous-month" type="button" aria-label="이전 달">‹</button>
        <button class="button button-secondary today-button" id="today-button" type="button">오늘</button>
        <button class="icon-button navigation-button" id="next-month" type="button" aria-label="다음 달">›</button>
      </div>
      <h2 class="month-title" id="month-title" aria-live="polite"></h2>
      <div class="create-control new-task-button">
        <button
          class="button button-primary create-menu-trigger"
          id="create-menu-button"
          type="button"
          aria-label="새 항목 만들기"
          aria-expanded="false"
          aria-controls="create-menu"
        >
          <svg class="create-plus-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 4V16M4 10H16"></path>
          </svg>
        </button>
        <div class="create-menu" id="create-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="new-task-button">일정 추가</button>
          <button type="button" role="menuitem" id="new-topic-button">주제 추가</button>
        </div>
      </div>
    </header>

    <div class="notification" id="notification" role="status" aria-live="polite" hidden></div>

    <main class="app-content">
      <section class="filter-bar" aria-label="일정 필터와 범례">
        <div class="filter-group" aria-label="상태 필터">
          <label class="filter-chip status-todo">
            <input type="checkbox" value="todo" data-status-filter checked>
            <span class="status-dot" aria-hidden="true"></span> 할 일
          </label>
          <label class="filter-chip status-doing">
            <input type="checkbox" value="doing" data-status-filter checked>
            <span class="status-dot" aria-hidden="true"></span> 진행 중
          </label>
          <label class="filter-chip status-done">
            <input type="checkbox" value="done" data-status-filter checked>
            <span class="status-dot" aria-hidden="true"></span> 완료
          </label>
          <label class="filter-chip overdue-filter">
            <input type="checkbox" id="overdue-filter">
            <span aria-hidden="true">!</span> 마감 초과 <strong id="overdue-count">0</strong>
          </label>
        </div>
        <p class="filter-empty" id="filter-empty" hidden>표시할 상태를 하나 이상 선택해 주세요.</p>
      </section>

      <div class="diary-layout">
        <section class="calendar-shell" aria-label="월간 일정 달력">
          <div id="calendar"></div>
        </section>

        <aside class="date-panel" id="date-panel" aria-labelledby="selected-date-title">
          <header class="date-panel-header">
            <div>
              <p class="eyebrow">SELECTED DATE</p>
              <h2 id="selected-date-title"></h2>
            </div>
            <span class="selected-count" id="selected-count">0</span>
          </header>
          <nav class="topic-filter-shell" id="topic-filter-shell" aria-label="선택한 날짜 주제">
            <div class="topic-filter-nav" id="topic-filter-viewport">
              <div class="topic-filter-list" id="topic-filter-list"></div>
            </div>
            <button
              class="topic-overflow-button"
              id="topic-overflow-button"
              type="button"
              aria-label="활성 주제 전체 보기"
              aria-expanded="false"
              aria-controls="topic-overflow-popover"
              hidden
            >
              <svg class="control-chevron-icon topic-overflow-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 7.5L10 12.5L15 7.5"></path>
              </svg>
            </button>
            <div class="topic-overflow-popover" id="topic-overflow-popover" hidden>
              <div class="topic-overflow-header">
                <strong>활성 주제</strong>
                <span id="active-topic-count">0</span>
              </div>
              <div class="topic-overflow-list" id="topic-overflow-list"></div>
            </div>
          </nav>
          <div class="selected-task-list" id="selected-task-list"></div>
          <nav class="selected-pagination" id="selected-pagination" aria-label="선택한 날짜 일정 페이지" hidden>
            <button class="pagination-button" id="previous-selected-page" type="button" aria-label="이전 일정 페이지">
              <svg class="control-chevron-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M12.5 5L7.5 10L12.5 15"></path>
              </svg>
            </button>
            <span id="selected-page-status" aria-live="polite">1 / 1</span>
            <button class="pagination-button" id="next-selected-page" type="button" aria-label="다음 일정 페이지">
              <svg class="control-chevron-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M7.5 5L12.5 10L7.5 15"></path>
              </svg>
            </button>
          </nav>
          <button class="button button-secondary add-date-task" id="add-date-task" type="button">
            ＋ 이 날짜에 일정 추가
          </button>
        </aside>
      </div>
    </main>

    <dialog class="task-dialog" id="task-dialog" aria-labelledby="dialog-title">
      <form id="task-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">SCHEDULE DETAILS</p>
            <h2 id="dialog-title">새 일정</h2>
          </div>
          <button class="icon-button" id="close-dialog" type="button" aria-label="닫기">×</button>
        </div>

        <input id="task-id" type="hidden">
        <label for="task-title">제목</label>
        <input id="task-title" name="title" type="text" maxlength="120" required autofocus>

        <label for="task-description">설명 <span class="optional">(선택)</span></label>
        <textarea id="task-description" name="description" rows="4"></textarea>

        <fieldset class="topic-fieldset">
          <legend>주제 <span class="optional">(여러 개 선택 가능)</span></legend>
          <div class="task-topic-options" id="task-topic-options"></div>
          <p class="topic-empty-message" id="task-topic-empty" hidden>
            등록된 주제가 없습니다. 상단 ＋ 메뉴에서 주제를 추가할 수 있습니다.
          </p>
        </fieldset>

        <label class="all-day-toggle" for="task-all-day">
          <input id="task-all-day" name="all_day" type="checkbox">
          <span>종일 일정</span>
        </label>

        <div class="date-fields timed-fields" id="timed-fields">
          <div>
            <label for="task-start-at">시작</label>
            <input id="task-start-at" name="start_at" type="datetime-local" step="60">
          </div>
          <div>
            <label for="task-due-at">마감</label>
            <input id="task-due-at" name="due_at" type="datetime-local" step="60">
          </div>
        </div>

        <div class="date-fields all-day-fields" id="all-day-fields" hidden>
          <div>
            <label for="task-start-date">시작일</label>
            <input id="task-start-date" type="date">
          </div>
          <div>
            <label for="task-due-date">마감일</label>
            <input id="task-due-date" type="date">
          </div>
        </div>

        <label for="task-status">상태</label>
        <select id="task-status" name="status">
          <option value="todo">할 일</option>
          <option value="doing">진행 중</option>
          <option value="done">완료</option>
        </select>

        <div class="dialog-actions">
          <button class="button delete-dialog-button" id="delete-task-button" type="button" hidden>삭제</button>
          <span class="action-spacer"></span>
          <button class="button button-secondary" id="cancel-dialog" type="button">취소</button>
          <button class="button button-primary" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <dialog class="task-dialog topic-dialog" id="topic-dialog" aria-labelledby="topic-dialog-title">
      <form id="topic-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">TOPIC DETAILS</p>
            <h2 id="topic-dialog-title">새 주제</h2>
          </div>
          <button class="icon-button" id="close-topic-dialog" type="button" aria-label="닫기">×</button>
        </div>

        <input id="topic-id" type="hidden">
        <label for="topic-name">이름</label>
        <input id="topic-name" name="name" type="text" maxlength="40" required>

        <label for="topic-color">색상</label>
        <div class="topic-color-field">
          <input id="topic-color" name="color" type="color" value="#375f55" required>
          <output id="topic-color-value" for="topic-color">#375F55</output>
        </div>

        <div class="dialog-actions">
          <button class="button delete-dialog-button" id="delete-topic-button" type="button" hidden>삭제</button>
          <span class="action-spacer"></span>
          <button class="button button-secondary" id="cancel-topic-dialog" type="button">취소</button>
          <button class="button button-primary" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <template id="selected-task-template">
      <article class="selected-task-card">
        <button class="selected-task-main" type="button">
          <span class="selected-task-status"></span>
          <span class="selected-task-copy">
            <strong class="selected-task-title"></strong>
            <span class="selected-task-time"></span>
            <span class="selected-task-topics"></span>
          </span>
          <span class="overdue-mark" aria-label="마감 초과" hidden>!</span>
        </button>
      </article>
    </template>

    <script src="/static/vendor/fullcalendar/7.0.2/fullcalendar.global.js"></script>
    <script src="/static/vendor/fullcalendar/7.0.2/locales-all/global.js"></script>
    <script src="/static/vendor/fullcalendar/7.0.2/themes/classic/global.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
