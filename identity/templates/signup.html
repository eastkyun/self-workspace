{% extends "app_shell.html" %}
{% block page_head %}<link rel="stylesheet" href="/static/shared/auth.css">{% endblock %}
{% block content %}
<main class="auth-card"><div class="auth-card-heading"><p class="auth-kicker">START YOUR NEST</p><h2>나만의 Nest를 시작하세요</h2><p>개인 작업과 팀의 협업을 한곳에서 관리할 수 있습니다.</p></div><form method="post" data-auth-form data-endpoint="/api/v1/auth/signup"><label><span>이름 <small>선택</small></span><input name="display_name" autocomplete="name" placeholder="어떻게 불러드릴까요?"></label><label><span>이메일</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label><span>비밀번호</span><span class="auth-password-field"><input name="password" type="password" autocomplete="new-password" placeholder="8자 이상의 비밀번호" required><button type="button" data-password-toggle aria-label="비밀번호 표시">보기</button></span></label><p class="auth-form-hint">계정을 만들면 기본 개인 workspace가 함께 생성됩니다.</p><button class="auth-submit" type="submit">무료로 시작하기</button><p data-auth-error role="alert"></p></form><div class="auth-card-links"><span>이미 계정이 있나요? <a href="/login">로그인</a></span></div></main>
{% block page_scripts %}<script src="/static/shared/auth.js?v=3" defer></script>{% endblock %}
{% endblock %}
