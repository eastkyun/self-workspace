{% extends "app_shell.html" %}
{% block page_head %}<link rel="stylesheet" href="/static/shared/auth.css">{% endblock %}
{% block content %}<main class="auth-card"><div class="auth-card-heading"><p class="auth-kicker">ACCOUNT RECOVERY</p><h2>새 비밀번호 설정</h2><p>안전한 새 비밀번호를 입력하세요.</p></div><form method="post" data-reset-form><label><span>새 비밀번호</span><span class="auth-password-field"><input name="new_password" type="password" autocomplete="new-password" placeholder="새 비밀번호를 입력하세요" required><button type="button" data-password-toggle>보기</button></span></label><button class="auth-submit" type="submit">비밀번호 변경</button><p data-auth-error role="alert"></p></form></main>{% endblock %}
{% block page_scripts %}<script src="/static/shared/auth.js?v=3" defer></script>{% endblock %}
