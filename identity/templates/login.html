{% extends "app_shell.html" %}
{% block page_head %}<link rel="stylesheet" href="/static/shared/auth.css">{% endblock %}
{% block content %}
<main class="auth-card"><div class="auth-card-heading"><p class="auth-kicker">WELCOME BACK</p><h2>다시 만나 반가워요</h2><p>Nest에서 작업을 이어가세요.</p></div><form method="post" data-auth-form data-endpoint="/api/v1/auth/login" data-success-url="{{ login_success_url|default('/workspace-selector') }}"><label><span>이메일</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label><span>비밀번호</span><span class="auth-password-field"><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required><button type="button" data-password-toggle aria-label="비밀번호 표시">보기</button></span></label><button class="auth-submit" type="submit">로그인</button><p data-auth-error role="alert"></p></form><div class="auth-card-links"><a href="/forgot-password">비밀번호를 잊으셨나요?</a><span>계정이 없나요? <a href="/signup">회원가입</a></span></div></main>
{% block page_scripts %}<script src="/static/shared/auth.js?v=3" defer></script>{% endblock %}
{% endblock %}
