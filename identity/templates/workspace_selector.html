<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workspace 선택</title></head>
<body>
<main>
  <h1>Workspace</h1>
  <section aria-label="내 Workspace">

    {% endfor %}
  </section>
</main>
</body>
</html>
