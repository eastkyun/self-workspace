{% extends "workspace_settings_base.html" %}

{% block settings_content %}
  <section class="workspace-settings-card" aria-labelledby="workspace-details-title">
      <div class="workspace-settings-card-header">
        <div>
          <h3 id="workspace-details-title">워크스페이스 정보</h3>
          <p>멤버에게 표시되는 이름과 설명을 설정합니다.</p>
        </div>
        <span class="workspace-settings-type">{{ workspace.type }}</span>
      </div>

      <form data-workspace-form data-workspace-id="{{ workspace.id }}">
        <label class="workspace-settings-field">
          <span>이름 <small>필수</small></span>
          <input name="name" value="{{ workspace.name }}" maxlength="120" autocomplete="off" required>
          <small>사이드바와 워크스페이스 선택 화면에 표시됩니다.</small>
        </label>
        <label class="workspace-settings-field">
          <span>설명</span>
          <textarea name="description" rows="4" maxlength="500" placeholder="워크스페이스의 목적을 간단히 설명하세요.">{{ workspace.description or '' }}</textarea>
        </label>
        <label class="workspace-settings-field">
          <span>시간대 <small>필수</small></span>
          <input name="timezone" value="{{ workspace.timezone }}" autocomplete="off" required>
          <small>일정과 활동 기록의 날짜 및 시간 계산에 사용됩니다.</small>
        </label>

        <div class="workspace-settings-actions">
          <p role="status" aria-live="polite" data-status></p>
          <button type="submit" data-save-button>변경사항 저장</button>
        </div>
      </form>
  </section>
{% endblock %}
