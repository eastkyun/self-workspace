{% extends "app_shell.html" %}
{% block page_head %}<link rel="stylesheet" href="/static/shared/auth.css">{% endblock %}
{% block content %}<main class="auth-card"><div class="auth-card-heading"><p class="auth-kicker">ACCOUNT RECOVERY</p><h2>비밀번호를 재설정하세요</h2><p>가입한 이메일을 입력하면 재설정 안내를 보내드립니다.</p></div><form method="post" data-auth-form data-endpoint="/api/v1/auth/password-reset-requests"><label><span>이메일</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><button class="auth-submit" type="submit">재설정 링크 보내기</button><p data-auth-error role="alert"></p></form><div class="auth-card-links"><a href="/login">로그인으로 돌아가기</a></div></main>{% endblock %}
{% block page_scripts %}<script src="/static/shared/auth.js?v=3" defer></script>{% endblock %}
