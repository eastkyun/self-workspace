{% extends "app_shell.html" %}

{% block page_head %}
  <link rel="stylesheet" href="/static/shared/workspace-search.css">
{% endblock %}

{% block global_actions %}
  <a class="workspace-search-home" href="/w/{{ workspace.id }}/home">Home</a>
{% endblock %}

{% block content %}
<main class="workspace-search" data-workspace-search data-workspace-id="{{ workspace.id }}">
  <header class="workspace-search-hero">
    <p class="workspace-eyebrow">WORKSPACE SEARCH</p>
    <h2>필요한 작업을 한 번에 찾으세요.</h2>
    <p>현재 Workspace에서 사용할 수 있고 읽을 권한이 있는 앱만 검색합니다.</p>
    <form class="workspace-search-form" role="search" data-search-form>
      <label class="sr-only" for="workspace-search-query">Workspace 검색</label>
      <input id="workspace-search-query" name="q" type="search" maxlength="200" autocomplete="off" placeholder="Notes, 일정, 발행물 검색" data-search-query>
      <button type="submit">검색</button>
    </form>
  </header>
  <p class="workspace-search-status" aria-live="polite" data-search-status>검색어를 입력하세요.</p>
  <div class="workspace-search-results" data-search-results></div>
</main>
{% endblock %}

{% block page_scripts %}<script type="module" src="/static/shared/workspace-search.js"></script>{% endblock %}
